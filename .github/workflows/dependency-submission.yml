name: Dependency Submission

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          # Same Gradle the rest of CI builds with (build-ghidra.yml pins
          # 8.5) so the submitted graph matches what is actually resolved
          # at build time. Was 9.4.0 since the workflow's first version,
          # with no recorded reason for the divergence.
          gradle-version: '8.5'

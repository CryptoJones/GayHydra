name: Dependency Submission

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Generate dependency graph (upload only)
        uses: gradle/actions/dependency-submission@v6
        with:
          gradle-version: '9.4.0'
          # Fork-level "Dependency graph" is off by default on GitHub
          # and can't be toggled via API. Until Aaron enables it under
          # Settings > Code security, skip the submission step and just
          # generate + upload the snapshot as a workflow artifact.
          dependency-graph: generate-and-upload

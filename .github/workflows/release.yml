name: Release (build + sign + publish)

# Rec 17 #17-2: Sigstore Cosign keyless signing of release artifacts.
# See docs/security/BINARY_SIGNING.md for the design + DD-006.
#
# Triggers on a tag push matching v*. Builds Ghidra, produces the
# release zip (which bundles the upstream SBOM at support/sbom/bom.json
# via gradle/support/sbom.gradle), signs the zip with cosign keyless
# using the workflow's OIDC identity, and uploads zip + .sig + .crt
# to the GitHub release. Rec 21's standalone CycloneDX SBOM step was
# removed in Sprint 7 and is queued for Sprint 8 re-implementation.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build & sign (e.g. v26.1)'
        required: true

permissions:
  contents: write    # upload assets to releases
  id-token: write    # cosign keyless OIDC identity

jobs:
  build_sign_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra (produces release zip with bundled SBOM)
        run: gradle buildGhidra --parallel

      - name: Locate release zip
        id: artifacts
        run: |
          ZIP=$(ls build/dist/ghidra_*.zip | head -1)
          test -n "$ZIP" || { echo "no release zip produced"; exit 1; }
          echo "ZIP=$ZIP" >> $GITHUB_OUTPUT

      - name: Sign release zip (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ steps.artifacts.outputs.ZIP }}.sig \
            --output-certificate ${{ steps.artifacts.outputs.ZIP }}.crt \
            ${{ steps.artifacts.outputs.ZIP }}

      - name: Upload signed artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Strip refs/tags/ prefix if present.
          TAG=${REF#refs/tags/}
          gh release upload "$TAG" --clobber \
            ${{ steps.artifacts.outputs.ZIP }} \
            ${{ steps.artifacts.outputs.ZIP }}.sig \
            ${{ steps.artifacts.outputs.ZIP }}.crt

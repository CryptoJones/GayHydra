name: Release (build + sign + publish)

# Rec 17 #17-2: Sigstore Cosign keyless signing of release artifacts.
# See docs/security/BINARY_SIGNING.md for the design + DD-006.
# (Touched 2026-05-24 to force GHA re-index after the new-fork move.)
#
# Triggers on a tag push matching v*. Builds Ghidra, produces the
# release zip (which bundles the upstream SBOM at the top of the
# zip-prefix directory as bom.json via gradle/support/sbom.gradle),
# signs the zip with cosign keyless using the workflow's OIDC identity,
# and uploads zip + .sig + .crt to the GitHub release. Rec 21's
# standalone CycloneDX SBOM step was removed in Sprint 7 and is queued
# for Sprint 8 re-implementation.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build & sign (e.g. v26.1)'
        required: true

permissions:
  contents: write    # upload assets to releases
  id-token: write    # cosign keyless OIDC identity

jobs:
  build_sign_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra (produces release zip with bundled SBOM)
        run: gradle buildGhidra --parallel

      - name: Locate release zip + extract bundled SBOM
        id: artifacts
        run: |
          ZIP=$(ls build/dist/ghidra_*.zip | head -1)
          test -n "$ZIP" || { echo "no release zip produced"; exit 1; }
          echo "ZIP=$ZIP" >> $GITHUB_OUTPUT
          # The upstream NSA SBOM generator (gradle/support/sbom.gradle's
          # writeSoftwareBillOfMaterials, called from gradle/root/
          # distribution.gradle's assembleDistribution doLast) writes
          # bom.json at the top of the zip-prefix directory (i.e. the
          # same level as Ghidra/, docs/, support/), not under
          # support/sbom/. Extract it as a separate release asset so
          # downstream supply-chain scanners can consume it without
          # unzipping the full distribution.
          SBOM=build/dist/$(basename "$ZIP" .zip)-bom.json
          unzip -p "$ZIP" "*/bom.json" > "$SBOM"
          test -s "$SBOM" || { echo "bundled SBOM not found in zip at */bom.json"; exit 1; }
          echo "SBOM=$SBOM" >> $GITHUB_OUTPUT
          echo "Extracted SBOM: $(stat -c%s "$SBOM") bytes"

      - name: SBOM sanity gate (≥10 components)
        # Replaces the sbomSanityCheck task that was removed with the
        # cyclonedxBom revert in PR #220. If the upstream SBOM emitter
        # silently regresses (e.g. a gradle config rename causes it to
        # enumerate nothing), the count drops to ~0 and this step
        # fails the release rather than shipping an empty SBOM.
        env:
          SBOM: ${{ steps.artifacts.outputs.SBOM }}
        run: |
          # The upstream SBOM is CycloneDX-shaped JSON with .components
          # holding the per-jar entries.
          COUNT=$(python3 -c "import json,sys; d=json.load(open('$SBOM')); print(len(d.get('components', [])))")
          echo "SBOM components: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::SBOM sanity gate failed: $COUNT components, expected ≥10."
            echo "::error::Probable cause: the upstream gradle/support/sbom.gradle generator regressed."
            exit 1
          fi

      - name: Decompiler smoke test (gayhydra-dropper)
        # Extracts the freshly-built prebuilt, compiles the
        # samples/re-targets/gayhydra-dropper Go sample stripped,
        # runs the headless analyzer with the bundled
        # scripts/DumpDeobfuscate.java post-script, and asserts the
        # decompiler still recovers the literal XOR key 0x5A from
        # main.main (where the Go compiler inlines main.deobfuscate
        # at every call site). Catches: Go-analyzer regressions,
        # decompiler regressions, headless-launch regressions.
        #
        # See samples/re-targets/gayhydra-dropper/README.md for the
        # design + the three real regressions this test caught on its
        # first dogfood run.
        run: |
          set -euxo pipefail

          EXTRACT_DIR=$(mktemp -d)
          unzip -q "${{ steps.artifacts.outputs.ZIP }}" -d "$EXTRACT_DIR"
          GAYHYDRA=$(ls -d "$EXTRACT_DIR"/ghidra_* | head -1)
          test -n "$GAYHYDRA" || { echo "::error::no ghidra_* dir in $EXTRACT_DIR"; exit 1; }

          # JDK 21.0.10+ workaround: ObjectInputFilter$Config.
          # setSerialFilterFactory only honors one call; the JVM
          # pre-installs via -Djdk.serialFilterFactory before Ghidra's
          # programmatic install fires, so the second call dies with
          # IllegalStateException. Drop the -D so Ghidra's runtime
          # install is the first/only one. See SprintPlanning.md →
          # Sprint 10 "Release pipeline hardening" → upstream NSA bug
          # filing. Remove this sed once that lands.
          sed -i 's|^VMARGS=-Djdk.serialFilterFactory=ghidra.framework.remote.GhidraSerialFilterFactory|#&|' \
            "$GAYHYDRA/support/launch.properties"

          pushd samples/re-targets/gayhydra-dropper
          go build -ldflags="-s -w" -o /tmp/gh-dropper-stripped .
          popd

          PROJECT_DIR=$(mktemp -d)
          OUTPUT=$("$GAYHYDRA"/support/analyzeHeadless "$PROJECT_DIR" DropperRE \
            -import /tmp/gh-dropper-stripped \
            -postScript DumpDeobfuscate.java \
            -scriptPath samples/re-targets/gayhydra-dropper/scripts \
            -deleteProject 2>&1) || {
              echo "$OUTPUT"
              echo "::error::analyzeHeadless exited non-zero (smoke-test infrastructure failure)"
              exit 1
            }
          echo "$OUTPUT"

          if ! echo "$OUTPUT" | grep -q "RESULT: PASS"; then
            echo "::error::Decompiler smoke test FAILED — XOR key 0x5A not visible in main.main decompilation"
            echo "::error::See samples/re-targets/gayhydra-dropper/README.md for what this test asserts."
            exit 1
          fi

      - name: Data-segment smoke test (crackme-arrayxor)
        # Secondary sample with complementary signal: scans raw
        # initialized memory for two 16-byte arrays (key[] + expected[])
        # and asserts their XOR reconstructs the embedded password.
        # Doesn't require Ghidra to disassemble code or recognize Go
        # function bounds — purely tests data-segment recognition.
        # Catches: regressions in Ghidra's reading of Go's .noptrdata
        # / .rodata, regressions in MemoryBlock byte iteration, and
        # regressions in initialized-vs-uninitialized memory marking.
        #
        # Reuses the GAYHYDRA install extracted by the prior step
        # (still at $EXTRACT_DIR/ghidra_*).
        run: |
          set -euxo pipefail

          # Re-discover the extracted Ghidra install (prior step's
          # EXTRACT_DIR is scoped to that step's `run:` shell).
          GAYHYDRA=$(ls -d /tmp/tmp.*/ghidra_* 2>/dev/null | head -1)
          if [ -z "$GAYHYDRA" ]; then
            EXTRACT_DIR=$(mktemp -d)
            unzip -q "${{ steps.artifacts.outputs.ZIP }}" -d "$EXTRACT_DIR"
            GAYHYDRA=$(ls -d "$EXTRACT_DIR"/ghidra_* | head -1)
            sed -i 's|^VMARGS=-Djdk.serialFilterFactory=ghidra.framework.remote.GhidraSerialFilterFactory|#&|' \
              "$GAYHYDRA/support/launch.properties"
          fi

          pushd samples/re-targets/crackme-arrayxor
          go build -ldflags="-s -w" -o /tmp/crackme-stripped .
          popd

          PROJECT_DIR=$(mktemp -d)
          OUTPUT=$("$GAYHYDRA"/support/analyzeHeadless "$PROJECT_DIR" CrackmeRE \
            -import /tmp/crackme-stripped \
            -postScript DumpCrackme.java \
            -scriptPath samples/re-targets/crackme-arrayxor/scripts \
            -deleteProject 2>&1) || {
              echo "$OUTPUT"
              echo "::error::analyzeHeadless exited non-zero (crackme smoke-test infrastructure failure)"
              exit 1
            }
          echo "$OUTPUT"

          if ! echo "$OUTPUT" | grep -q "RESULT: PASS"; then
            echo "::error::Crackme smoke test FAILED — key[]/expected[] arrays not recoverable from binary"
            echo "::error::See samples/re-targets/crackme-arrayxor/README.md for what this test asserts."
            exit 1
          fi

      - name: Sign release zip (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ steps.artifacts.outputs.ZIP }}.sig \
            --output-certificate ${{ steps.artifacts.outputs.ZIP }}.crt \
            ${{ steps.artifacts.outputs.ZIP }}

      - name: Sign extracted SBOM (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ steps.artifacts.outputs.SBOM }}.sig \
            --output-certificate ${{ steps.artifacts.outputs.SBOM }}.crt \
            ${{ steps.artifacts.outputs.SBOM }}

      - name: Upload signed artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Strip refs/tags/ prefix if present.
          TAG=${REF#refs/tags/}
          # Tag-push doesn't auto-create a GitHub Release entry; create
          # one if it doesn't exist yet so `gh release upload` has
          # somewhere to attach assets. The first build for a given tag
          # always hits this branch; subsequent workflow_dispatch
          # re-runs against the same tag skip the create.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ZIP_NAME=$(basename "${{ steps.artifacts.outputs.ZIP }}")
            SBOM_NAME=$(basename "${{ steps.artifacts.outputs.SBOM }}")
            # Rec 17 #17-3: cosign verification commands in release notes.
            # The OIDC certificate identity proves the signature came from
            # release.yml on this repo, not a hand-run cosign off a
            # developer laptop. The regex covers both push (refs/tags/v*)
            # and workflow_dispatch invocations.
            # Heredoc body is indented to stay inside the YAML block
            # scalar; the leading 12 spaces are stripped before NOTES is
            # assigned so the rendered release notes have no left margin.
            NOTES=$(sed 's/^            //' <<EOF
            Automated release. Sprint notes appended at sprint close — see [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md).

            ## Verifying the artifacts (Rec 17, see [BINARY_SIGNING.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/security/BINARY_SIGNING.md))

            Both the distribution zip and the bundled CycloneDX SBOM are signed with [Sigstore Cosign keyless](https://docs.sigstore.dev/cosign/overview/) (no static signing key — the cert chains to GitHub Actions' OIDC issuer).

            \`\`\`bash
            ZIP=${ZIP_NAME}
            SBOM=${SBOM_NAME}

            # Verify the distribution zip
            cosign verify-blob \\\\
              --certificate "\$ZIP.crt" \\\\
              --signature "\$ZIP.sig" \\\\
              --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@' \\\\
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\\
              "\$ZIP"

            # Verify the CycloneDX SBOM
            cosign verify-blob \\\\
              --certificate "\$SBOM.crt" \\\\
              --signature "\$SBOM.sig" \\\\
              --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@' \\\\
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\\\
              "\$SBOM"
            \`\`\`

            A successful verify means the bytes you downloaded match what \`release.yml\` produced on a GitHub-hosted runner from this repo's source at this tag (modulo the workflow-vs-source caveat the SprintPlanning entry notes for early v26.1.x tags).
            EOF
            )
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" --clobber \
            ${{ steps.artifacts.outputs.ZIP }} \
            ${{ steps.artifacts.outputs.ZIP }}.sig \
            ${{ steps.artifacts.outputs.ZIP }}.crt \
            ${{ steps.artifacts.outputs.SBOM }} \
            ${{ steps.artifacts.outputs.SBOM }}.sig \
            ${{ steps.artifacts.outputs.SBOM }}.crt

      - name: Mirror release to Codeberg (Gitea API)
        # Codeberg is the canonical-source mirror (per DevGuide.md); without
        # this step, Codeberg-only users only see tags, never prebuilts.
        # Aaron: to enable, add a Codeberg user token to GitHub repo
        # Settings → Secrets and variables → Actions as CB_TOKEN. Until
        # the secret exists, this step exits 0 with a "skipped" message
        # rather than failing the release.
        env:
          CB_TOKEN: ${{ secrets.CB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
          CB_REPO: CryptoJones/GayHydra
        run: |
          if [ -z "${CB_TOKEN:-}" ]; then
            echo "::warning::CB_TOKEN secret not set; skipping Codeberg release mirror. Add it to repo Settings → Secrets and variables → Actions to enable."
            exit 0
          fi
          set -euxo pipefail
          TAG=${REF#refs/tags/}
          CB_API="https://codeberg.org/api/v1/repos/${CB_REPO}"

          # Create the Codeberg release entry if missing (same idempotency
          # logic as the GitHub branch above).
          if ! curl -fsS -H "Authorization: token ${CB_TOKEN}" \
              "${CB_API}/releases/tags/${TAG}" >/dev/null 2>&1; then
            curl -fsS -X POST -H "Authorization: token ${CB_TOKEN}" \
              -H "Content-Type: application/json" \
              "${CB_API}/releases" \
              -d "$(jq -nc --arg t "$TAG" \
                '{tag_name:$t, name:$t, body:"Automated release mirrored from GitHub. Sprint notes appended at sprint close — see CHANGELOG.md.", draft:false, prerelease:false}')"
          fi

          # Fetch the release ID (needed for asset uploads on Gitea API).
          REL_ID=$(curl -fsS -H "Authorization: token ${CB_TOKEN}" \
            "${CB_API}/releases/tags/${TAG}" | jq -r '.id')
          test -n "$REL_ID" && test "$REL_ID" != "null" || { echo "::error::Codeberg release id lookup failed for $TAG"; exit 1; }

          # Upload each asset; delete pre-existing asset of the same name
          # first (Gitea's POST /assets has no --clobber equivalent).
          upload() {
            local file="$1"
            local name
            name="$(basename "$file")"
            local existing
            existing=$(curl -fsS -H "Authorization: token ${CB_TOKEN}" \
              "${CB_API}/releases/${REL_ID}/assets" \
              | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -1)
            if [ -n "$existing" ]; then
              curl -fsS -X DELETE -H "Authorization: token ${CB_TOKEN}" \
                "${CB_API}/releases/${REL_ID}/assets/${existing}"
            fi
            curl -fsS -X POST -H "Authorization: token ${CB_TOKEN}" \
              -F "attachment=@${file};filename=${name}" \
              "${CB_API}/releases/${REL_ID}/assets?name=${name}"
          }

          upload "${{ steps.artifacts.outputs.ZIP }}"
          upload "${{ steps.artifacts.outputs.ZIP }}.sig"
          upload "${{ steps.artifacts.outputs.ZIP }}.crt"
          upload "${{ steps.artifacts.outputs.SBOM }}"
          upload "${{ steps.artifacts.outputs.SBOM }}.sig"
          upload "${{ steps.artifacts.outputs.SBOM }}.crt"

  # ---------------------------------------------------------------------
  # Mac (arm64) build — runs in parallel with the Linux job. Gated on
  # the Linux job's release-entry creation so this job's upload finds
  # an existing GitHub Release to attach to.
  #
  # Free on public repos (GitHub Actions billing FAQ: macOS runners
  # are free for public repositories).
  # ---------------------------------------------------------------------
  build_sign_publish_mac:
    needs: build_sign_publish
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install bison + flex (newer than macOS-shipped)
        run: |
          brew install bison flex
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra
        run: gradle buildGhidra --parallel

      - name: Locate release zip
        id: artifacts
        run: |
          ZIP=$(ls build/dist/ghidra_*_mac_*.zip | head -1)
          test -n "$ZIP" || { echo "no mac release zip produced"; exit 1; }
          echo "ZIP=$ZIP" >> $GITHUB_OUTPUT
          echo "Built: $ZIP ($(stat -f%z "$ZIP") bytes)"

      - name: Sign release zip (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ steps.artifacts.outputs.ZIP }}.sig \
            --output-certificate ${{ steps.artifacts.outputs.ZIP }}.crt \
            ${{ steps.artifacts.outputs.ZIP }}

      - name: Upload signed mac artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG=${REF#refs/tags/}
          # Linux job's `build_sign_publish` already ensures the release
          # entry exists (via the same gh release create idempotency
          # added in #333). This job just attaches its assets.
          gh release upload "$TAG" --clobber \
            ${{ steps.artifacts.outputs.ZIP }} \
            ${{ steps.artifacts.outputs.ZIP }}.sig \
            ${{ steps.artifacts.outputs.ZIP }}.crt

      - name: Mirror mac artifacts to Codeberg
        env:
          CB_TOKEN: ${{ secrets.CB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
          CB_REPO: CryptoJones/GayHydra
        run: |
          if [ -z "${CB_TOKEN:-}" ]; then
            echo "::warning::CB_TOKEN secret not set; skipping mac Codeberg mirror."
            exit 0
          fi
          set -euxo pipefail
          TAG=${REF#refs/tags/}
          CB_API="https://codeberg.org/api/v1/repos/${CB_REPO}"
          REL_ID=$(curl -fsS -H "Authorization: token ${CB_TOKEN}" \
            "${CB_API}/releases/tags/${TAG}" | jq -r '.id')
          upload() {
            local file="$1"
            local name
            name="$(basename "$file")"
            local existing
            existing=$(curl -fsS -H "Authorization: token ${CB_TOKEN}" \
              "${CB_API}/releases/${REL_ID}/assets" \
              | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -1)
            if [ -n "$existing" ]; then
              curl -fsS -X DELETE -H "Authorization: token ${CB_TOKEN}" \
                "${CB_API}/releases/${REL_ID}/assets/${existing}"
            fi
            curl -fsS -X POST -H "Authorization: token ${CB_TOKEN}" \
              -F "attachment=@${file};filename=${name}" \
              "${CB_API}/releases/${REL_ID}/assets?name=${name}"
          }
          upload "${{ steps.artifacts.outputs.ZIP }}"
          upload "${{ steps.artifacts.outputs.ZIP }}.sig"
          upload "${{ steps.artifacts.outputs.ZIP }}.crt"

  # ---------------------------------------------------------------------
  # Windows (x86_64) build — runs in parallel with linux + mac. Same
  # gating on the Linux job's release-entry creation. Free on public
  # repos (same GHA billing rule as macOS).
  # ---------------------------------------------------------------------
  build_sign_publish_windows:
    needs: build_sign_publish
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read JDK version
        shell: bash
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install winflexbison + Python (3.13 satisfies the supported list)
        shell: powershell
        run: |
          choco install -y --no-progress --acceptlicense winflexbison python313

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch Dependencies
        shell: cmd
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra
        shell: cmd
        run: gradle buildGhidra --parallel

      - name: Locate release zip
        id: artifacts
        shell: bash
        run: |
          ZIP=$(ls build/dist/ghidra_*_windows_*.zip | head -1)
          test -n "$ZIP" || { echo "no windows release zip produced"; exit 1; }
          echo "ZIP=$ZIP" >> $GITHUB_OUTPUT
          echo "Built: $ZIP"

      - name: Sign release zip (cosign keyless)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature "${{ steps.artifacts.outputs.ZIP }}.sig" \
            --output-certificate "${{ steps.artifacts.outputs.ZIP }}.crt" \
            "${{ steps.artifacts.outputs.ZIP }}"

      - name: Upload signed windows artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG=${REF#refs/tags/}
          gh release upload "$TAG" --clobber \
            "${{ steps.artifacts.outputs.ZIP }}" \
            "${{ steps.artifacts.outputs.ZIP }}.sig" \
            "${{ steps.artifacts.outputs.ZIP }}.crt"

      - name: Mirror windows artifacts to Codeberg
        shell: bash
        env:
          CB_TOKEN: ${{ secrets.CB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
          CB_REPO: CryptoJones/GayHydra
        run: |
          if [ -z "${CB_TOKEN:-}" ]; then
            echo "::warning::CB_TOKEN secret not set; skipping windows Codeberg mirror."
            exit 0
          fi
          set -euxo pipefail
          TAG=${REF#refs/tags/}
          CB_API="https://codeberg.org/api/v1/repos/${CB_REPO}"
          REL_ID=$(curl -fsS -H "Authorization: token ${CB_TOKEN}" \
            "${CB_API}/releases/tags/${TAG}" | jq -r '.id')
          upload() {
            local file="$1"
            local name
            name="$(basename "$file")"
            local existing
            existing=$(curl -fsS -H "Authorization: token ${CB_TOKEN}" \
              "${CB_API}/releases/${REL_ID}/assets" \
              | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -1)
            if [ -n "$existing" ]; then
              curl -fsS -X DELETE -H "Authorization: token ${CB_TOKEN}" \
                "${CB_API}/releases/${REL_ID}/assets/${existing}"
            fi
            curl -fsS -X POST -H "Authorization: token ${CB_TOKEN}" \
              -F "attachment=@${file};filename=${name}" \
              "${CB_API}/releases/${REL_ID}/assets?name=${name}"
          }
          upload "${{ steps.artifacts.outputs.ZIP }}"
          upload "${{ steps.artifacts.outputs.ZIP }}.sig"
          upload "${{ steps.artifacts.outputs.ZIP }}.crt"

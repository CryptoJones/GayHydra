name: Release (build + sign + publish)

# Rec 17 #17-2: Sigstore Cosign keyless signing of release artifacts.
# See docs/security/BINARY_SIGNING.md for the design + DD-006.
#
# Triggers on a tag push matching v*. Builds Ghidra, produces the
# release zip (which bundles the upstream SBOM at the top of the
# zip-prefix directory as bom.json via gradle/support/sbom.gradle),
# signs the zip with cosign keyless using the workflow's OIDC identity,
# and uploads zip + .sig + .crt to the GitHub release. Rec 21's
# standalone CycloneDX SBOM step was removed in Sprint 7 and is queued
# for Sprint 8 re-implementation.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build & sign (e.g. v26.1)'
        required: true

permissions:
  contents: write    # upload assets to releases
  id-token: write    # cosign keyless OIDC identity

jobs:
  build_sign_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra (produces release zip with bundled SBOM)
        run: gradle buildGhidra --parallel

      - name: Locate release zip + extract bundled SBOM
        id: artifacts
        run: |
          ZIP=$(ls build/dist/ghidra_*.zip | head -1)
          test -n "$ZIP" || { echo "no release zip produced"; exit 1; }
          echo "ZIP=$ZIP" >> $GITHUB_OUTPUT
          # The upstream NSA SBOM generator (gradle/support/sbom.gradle's
          # writeSoftwareBillOfMaterials, called from gradle/root/
          # distribution.gradle's assembleDistribution doLast) writes
          # bom.json at the top of the zip-prefix directory (i.e. the
          # same level as Ghidra/, docs/, support/), not under
          # support/sbom/. Extract it as a separate release asset so
          # downstream supply-chain scanners can consume it without
          # unzipping the full distribution.
          SBOM=build/dist/$(basename "$ZIP" .zip)-bom.json
          unzip -p "$ZIP" "*/bom.json" > "$SBOM"
          test -s "$SBOM" || { echo "bundled SBOM not found in zip at */bom.json"; exit 1; }
          echo "SBOM=$SBOM" >> $GITHUB_OUTPUT
          echo "Extracted SBOM: $(stat -c%s "$SBOM") bytes"

      - name: SBOM sanity gate (≥10 components)
        # Replaces the sbomSanityCheck task that was removed with the
        # cyclonedxBom revert in PR #220. If the upstream SBOM emitter
        # silently regresses (e.g. a gradle config rename causes it to
        # enumerate nothing), the count drops to ~0 and this step
        # fails the release rather than shipping an empty SBOM.
        env:
          SBOM: ${{ steps.artifacts.outputs.SBOM }}
        run: |
          # The upstream SBOM is CycloneDX-shaped JSON with .components
          # holding the per-jar entries.
          COUNT=$(python3 -c "import json,sys; d=json.load(open('$SBOM')); print(len(d.get('components', [])))")
          echo "SBOM components: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::SBOM sanity gate failed: $COUNT components, expected ≥10."
            echo "::error::Probable cause: the upstream gradle/support/sbom.gradle generator regressed."
            exit 1
          fi

      - name: Decompiler smoke test (gayhydra-dropper)
        # Extracts the freshly-built prebuilt, compiles the
        # samples/re-targets/gayhydra-dropper Go sample stripped,
        # runs the headless analyzer with the bundled
        # scripts/DumpDeobfuscate.java post-script, and asserts the
        # decompiler still recovers the literal XOR key 0x5A from
        # main.main (where the Go compiler inlines main.deobfuscate
        # at every call site). Catches: Go-analyzer regressions,
        # decompiler regressions, headless-launch regressions.
        #
        # See samples/re-targets/gayhydra-dropper/README.md for the
        # design + the three real regressions this test caught on its
        # first dogfood run.
        run: |
          set -euxo pipefail

          EXTRACT_DIR=$(mktemp -d)
          unzip -q "${{ steps.artifacts.outputs.ZIP }}" -d "$EXTRACT_DIR"
          GAYHYDRA=$(ls -d "$EXTRACT_DIR"/ghidra_* | head -1)
          test -n "$GAYHYDRA" || { echo "::error::no ghidra_* dir in $EXTRACT_DIR"; exit 1; }

          # JDK 21.0.10+ workaround: ObjectInputFilter$Config.
          # setSerialFilterFactory only honors one call; the JVM
          # pre-installs via -Djdk.serialFilterFactory before Ghidra's
          # programmatic install fires, so the second call dies with
          # IllegalStateException. Drop the -D so Ghidra's runtime
          # install is the first/only one. See SprintPlanning.md →
          # Sprint 10 "Release pipeline hardening" → upstream NSA bug
          # filing. Remove this sed once that lands.
          sed -i 's|^VMARGS=-Djdk.serialFilterFactory=ghidra.framework.remote.GhidraSerialFilterFactory|#&|' \
            "$GAYHYDRA/support/launch.properties"

          pushd samples/re-targets/gayhydra-dropper
          go build -ldflags="-s -w" -o /tmp/gh-dropper-stripped .
          popd

          PROJECT_DIR=$(mktemp -d)
          OUTPUT=$("$GAYHYDRA"/support/analyzeHeadless "$PROJECT_DIR" DropperRE \
            -import /tmp/gh-dropper-stripped \
            -postScript DumpDeobfuscate.java \
            -scriptPath samples/re-targets/gayhydra-dropper/scripts \
            -deleteProject 2>&1) || {
              echo "$OUTPUT"
              echo "::error::analyzeHeadless exited non-zero (smoke-test infrastructure failure)"
              exit 1
            }
          echo "$OUTPUT"

          if ! echo "$OUTPUT" | grep -q "RESULT: PASS"; then
            echo "::error::Decompiler smoke test FAILED — XOR key 0x5A not visible in main.main decompilation"
            echo "::error::See samples/re-targets/gayhydra-dropper/README.md for what this test asserts."
            exit 1
          fi

      - name: Sign release zip (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ steps.artifacts.outputs.ZIP }}.sig \
            --output-certificate ${{ steps.artifacts.outputs.ZIP }}.crt \
            ${{ steps.artifacts.outputs.ZIP }}

      - name: Sign extracted SBOM (cosign keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ steps.artifacts.outputs.SBOM }}.sig \
            --output-certificate ${{ steps.artifacts.outputs.SBOM }}.crt \
            ${{ steps.artifacts.outputs.SBOM }}

      - name: Upload signed artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Strip refs/tags/ prefix if present.
          TAG=${REF#refs/tags/}
          gh release upload "$TAG" --clobber \
            ${{ steps.artifacts.outputs.ZIP }} \
            ${{ steps.artifacts.outputs.ZIP }}.sig \
            ${{ steps.artifacts.outputs.ZIP }}.crt \
            ${{ steps.artifacts.outputs.SBOM }} \
            ${{ steps.artifacts.outputs.SBOM }}.sig \
            ${{ steps.artifacts.outputs.SBOM }}.crt

name: Decompiler ASan/UBSan

on:
  schedule:
    - cron: '37 4 * * *'   # nightly, after primary CI quiets down
  workflow_dispatch:
  pull_request:
    paths:
      - 'Ghidra/Features/Decompiler/src/decompile/**'
      - '.github/workflows/decompiler-sanitizers.yml'

permissions:
  contents: read

jobs:
  test_san:
    name: ASan + UBSan unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex \
            clang \
            libstdc++-12-dev \
            binutils-dev libiberty-dev

      - name: Read Ghidra JDK version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Compile SLEIGH language files (.sla)
        # decomp_test_san loads real processor specs at startup; see
        # the matching step in decompiler-cpp-tests.yml.
        run: gradle allSleighCompile --parallel

      - name: Build decomp_test_san
        working-directory: Ghidra/Features/Decompiler/src/decompile/cpp
        env:
          # Use the same compiler the OSS-Fuzz harnesses use; ensures
          # findings here reproduce there.
          CXX: clang++
        run: make -j$(nproc) decomp_test_san

      - name: Run sanitized unit tests (skip data-driven XML tests)
        working-directory: Ghidra/Features/Decompiler/src/decompile/cpp
        # Match the scope of decompiler-cpp-tests.yml — unit tests only.
        # datatests/*.xml have inherited-upstream failures tracked
        # separately; running them under ASan would just amplify noise.
        run: ./decomp_test_san unittests

      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: san-logs
          path: |
            Ghidra/Features/Decompiler/src/decompile/cpp/*.log
            Ghidra/Features/Decompiler/src/decompile/cpp/decomp_test_san
          if-no-files-found: ignore

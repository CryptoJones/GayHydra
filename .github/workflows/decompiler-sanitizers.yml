name: Decompiler ASan/UBSan

on:
  schedule:
    - cron: '37 4 * * *'   # nightly, after primary CI quiets down
  workflow_dispatch:
  pull_request:
    paths:
      - 'Ghidra/Features/Decompiler/src/decompile/**'
      - '.github/workflows/decompiler-sanitizers.yml'

permissions:
  contents: read

jobs:
  test_san:
    name: ASan + UBSan unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex \
            clang \
            libstdc++-12-dev
      - name: Build & run sanitized unit tests
        working-directory: Ghidra/Features/Decompiler/src/decompile/cpp
        env:
          # Use the same compiler the OSS-Fuzz harnesses use; ensures
          # findings here reproduce there.
          CXX: clang++
        run: make -j$(nproc) test_san

      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: san-logs
          path: |
            Ghidra/Features/Decompiler/src/decompile/cpp/*.log
            Ghidra/Features/Decompiler/src/decompile/cpp/decomp_test_san
          if-no-files-found: ignore

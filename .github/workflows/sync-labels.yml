name: Sync labels

# Rec 08 follow-up: keep the live GitHub labels in sync with the
# declarative set at .github/labels.yml. See LABEL_POLICY.md for
# the canonical definitions.

on:
  push:
    branches: [master]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # Live mode: dry-run was used for the initial landing so the
          # diff could be eyeballed before any label was created or
          # deleted from the live repo. Aaron confirmed 2026-05-26
          # that the dry-run output looked correct, so the workflow
          # now applies labels.yml changes directly.
          dry-run: false
          skip-delete: false

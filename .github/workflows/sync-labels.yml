name: Sync labels

# Rec 08 follow-up: keep the live GitHub labels in sync with the
# declarative set at .github/labels.yml. See LABEL_POLICY.md for
# the canonical definitions.

on:
  push:
    branches: [master]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/sync-labels.yml'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # dry-run mode for the first landing of this workflow so
          # we can verify the diff before any label is created or
          # deleted from the live repo. Flip to false in a follow-up
          # PR after Aaron has reviewed the dry-run output.
          dry-run: true
          skip-delete: false

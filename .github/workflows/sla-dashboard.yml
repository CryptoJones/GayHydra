# TRIAGE_SLA.md / PR_QUEUE_POLICY.md promise a nightly-committed
# queue-health dashboard; the 2026-06-11 meta-review found it never existed.
# Same auto-commit pattern as upstream-crossref-refresh.yml.

name: SLA dashboard

on:
  schedule:
    - cron: '47 6 * * *'   # nightly, after the 06:17 crossref
  workflow_dispatch:

permissions:
  contents: write   # to push the refreshed dashboard

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sla-dashboard.py

      - name: Commit any changes
        run: |
          if [[ -z $(git status --porcelain docs/governance/sla-dashboard.md) ]]; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/governance/sla-dashboard.md
          git commit -m "$(printf 'chore: refresh SLA dashboard (%s)\n\nAutomated update by .github/workflows/sla-dashboard.yml.' "$(date -u +%Y-%m-%d)")"
          git push origin master

name: Build Ghidra

on:
  push:
    # Feature branches are already built via their pull_request trigger;
    # restricting push to master avoids the double-run that floods the
    # runner queue. The flood was starving master's own runs into
    # cancellation, which GitHub renders as a red "failing" README badge
    # even though no build actually failed.
    branches: [master]
  pull_request:
  workflow_dispatch:

# Dedupe rapid re-pushes without starving master. A PR re-push cancels
# its own superseded in-progress run to free runners; push (master) runs
# are NEVER cancelled, so master always lands a real success/failure
# conclusion and the badge reflects true build health.
concurrency:
  group: build-ghidra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      # fail-fast off: one platform's transient flake should not
      # cancel the others — we want to see all three platforms.
      fail-fast: false
      matrix:
        # Rec 23: build on all three native-decompiler platforms.
        # Native bugs on Windows and macOS are otherwise caught by
        # users rather than maintainers.
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Read Ghidra JDK Version (Unix)
        if: runner.os != 'Windows'
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Read Ghidra JDK Version (Windows)
        if: runner.os == 'Windows'
        # Windows runners use PowerShell by default; awk isn't on PATH.
        shell: pwsh
        run: |
          $line = Get-Content Ghidra/application.properties | Where-Object { $_ -match '^application\.java\.min=' }
          $ver = ($line -split '=')[1]
          echo "JDK_VER=$ver" >> $env:GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      # The Ghidra repo doesn't check in the Gradle wrapper jar, so
      # ./gradlew fails with "install Gradle 8.5+ on your PATH". Use
      # gradle/actions/setup-gradle to install a pinned Gradle and
      # invoke it directly (no wrapper indirection).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra
        run: gradle buildGhidra --parallel

  # Platform-independent static-source / config audits. These previously
  # ran inside the 3-platform `unit_tests` matrix — 3x redundant work that
  # only surfaced after the ~35-min JVM test suite. Hoisted into a single
  # ubuntu-only job (independent of `build`) so they run once and give a
  # fast early-fail signal. Still required for a PR to be green.
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Ghidra JDK Version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Audit @Ignore annotations (Rec 28 #28-3, strict)
        # Tree-wide sweep completed in PR #194; flip to strict so
        # any future bare/uncategorized @Ignore fails CI.
        run: gradle ignoreAudit -PignoreAuditStrict=true

      - name: Audit raw ObjectInputStream (Rec 19 #19-6)
        # Forbid any `new ObjectInputStream(...)` outside SafeObjectInput.
        # In-tree count is zero after #19-2/#19-3/#19-5; this gate fails
        # CI on any regression that reintroduces unfiltered deserialization.
        run: gradle objectInputStreamAudit

      - name: Audit C++ RAII protected files (Rec 31 #31-2)
        # Forbid raw `new` allocations in the decompile/cpp protected set.
        # Already RAII-clean (zero raw new); this gate fails CI on any
        # regression that reintroduces a raw owning pointer.
        run: gradle cppRaiiAudit

      - name: i18n lint (Docking)
        # Localization PoC: fail the build if a hardcoded UI literal
        # reappears in Ghidra/Framework/Docking outside the
        # documented allowlist. See docs/i18n/DEVELOPER-GUIDE.md.
        run: gradle :Docking:i18nLint

  # Rec 22: run the JVM unit-test suite. Was previously not run in CI.
  # Independent job so a flaky/slow test failure does not block the
  # build artifact in `build`. Both jobs are required to pass for a PR
  # to be marked green; the split is for clearer red signal, not for
  # bypassability.
  unit_tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Rec 23: expand from Ubuntu-only to all three native-decompiler
        # platforms. The `build` job already runs on this matrix
        # successfully (per release.yml's parallel build_sign_publish_*
        # jobs); this job covers the JVM unit-test surface on the same
        # OSes so platform-specific test bugs surface here rather than
        # at user-reported time.
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    # The MicrosoftDmang demangler suite is the macOS long pole: MDMangBaseTest
    # plus its VS2013/VS2015/Ghidra/Genericize/ParseInfo subclasses each re-run
    # the same ~15.7k-line combinatorial assertion set, and on the ~2x-slower
    # macOS runner that pushed the leg to ~88-90 min — close enough to the old
    # 90-min cap to trip a timeout-cancel that read as a false red (every test
    # passing). The suite is pure platform-independent string processing, so it
    # now runs once on the fast ubuntu leg and is excluded on the slower
    # macOS/windows legs (see "Run JVM unit tests" below). The 120-min cap is
    # kept as headroom for the remaining platform-sensitive suites.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Read Ghidra JDK Version (Unix)
        if: runner.os != 'Windows'
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Read Ghidra JDK Version (Windows)
        if: runner.os == 'Windows'
        # Windows runners use PowerShell by default; awk isn't on PATH.
        shell: pwsh
        run: |
          $line = Get-Content Ghidra/application.properties | Where-Object { $_ -match '^application\.java\.min=' }
          $ver = ($line -split '=')[1]
          echo "JDK_VER=$ver" >> $env:GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Compile (prepdev)
        run: gradle prepdev --parallel

      - name: Run JVM unit tests
        # --continue: don't stop at the first failure; surface the
        # whole picture in one CI run.
        # Exclude the platform-independent MicrosoftDmang demangler suite on the
        # slower macOS/windows legs — it's the combinatorial long pole and is
        # fully exercised on the ubuntu leg (see timeout note above).
        run: gradle test ${{ matrix.platform != 'ubuntu-latest' && '-x :MicrosoftDmang:test' || '' }} --parallel --continue

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.platform }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ matrix.platform }}
          path: |
            **/build/reports/jacoco/**
          if-no-files-found: ignore
          retention-days: 30

  # Rec 33 #33-2.6 / DD-0005: continuously validate the negotiated v1 framing
  # tunnel (the FrameInStreambuf/FrameOutStreambuf command-loop flip in
  # ghidra_process.cc) and, going forward, the Rec 34 FlatBuffers IPC
  # dual-encode commands. These are exercised only by
  # DecompileProcessFramingV1EndToEndTest, an AbstractGhidraHeadlessIntegrationTest
  # that spawns the real native `decompile` worker, forces framing to v0 then
  # v1, runs a full real decompilation (registerProgram + decompileAt + every
  # host callback) through the v1 frame tunnel, and asserts v1 output is
  # byte-identical to v0. The `unit_tests` job runs `gradle test`, which does
  # NOT execute the `src/test.slow` integration suite — so without this job the
  # entire command-loop / IPC tunnel is unguarded in CI. Ubuntu-only: the test
  # validates the wire protocol (platform-independent), so one Linux leg is a
  # sufficient regression guard.
  ipc_e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Read Ghidra JDK Version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build native decompiler
        # The e2e test spawns the real native `decompile` worker. The
        # integrationTest task compiles the sleigh languages and the Java test
        # sources but does NOT build the native binary, so build it explicitly.
        run: gradle :Decompiler:decompileLinux_x86_64Executable --parallel

      - name: Run IPC v1 framing e2e integration test
        run: gradle :Decompiler:integrationTest --tests "ghidra.app.decompiler.DecompileProcessFramingV1EndToEndTest"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ipc-e2e
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

/* ###
 * ErrorProne static analysis.
 *
 * Addresses Rec 26 of the 2026-05-21 audit. See
 * docs/testing/ERRORPRONE.md for the full plan.
 *
 * Wires ErrorProne via the net.ltgt.errorprone Gradle plugin.
 * ErrorProne is a javac plugin: zero runtime cost, catches a known
 * set of mistakes at compile time. The intent for this rec is
 * *signal-only* — every check is at WARNING, not ERROR — until the
 * existing backlog is fixed (see ratchet in ERRORPRONE.md).
 *
 * Apply this from the root build.gradle:
 *   apply from: 'gradle/errorprone.gradle'
 */

// The plugins {} block lives in the root build.gradle. This file just
// applies the plugin to every java-library subproject and configures
// it. Imports must be at the top of the script.
import net.ltgt.gradle.errorprone.CheckSeverity

subprojects {
    plugins.withId('java-library') {
        apply plugin: 'net.ltgt.errorprone'

        dependencies {
            errorprone 'com.google.errorprone:error_prone_core:2.27.0'
        }

        tasks.withType(JavaCompile).configureEach {
            options.errorprone {
                // Stage 1: signal-only. Every check at WARNING.
                // No checks at ERROR. This intentionally avoids
                // making the existing tree red.
                allErrorsAsWarnings = true

                // High-EV checks we want even at Stage 1.
                check('ImmutableEnumChecker', CheckSeverity.WARN)
                check('MissingOverride', CheckSeverity.WARN)
                check('MutableConstantField', CheckSeverity.WARN)
                check('MutableMethodReturnType', CheckSeverity.WARN)
                check('CollectionToArraySafeParameter', CheckSeverity.WARN)
                check('DefaultCharset', CheckSeverity.WARN)
                check('EqualsHashCode', CheckSeverity.WARN)
                check('EqualsIncompatibleType', CheckSeverity.WARN)
                check('StringSplitter', CheckSeverity.WARN)

                // Checks we explicitly defer to a later stage of the
                // ratchet because the existing codebase has hundreds
                // of instances and the fix is non-mechanical.
                disable('JavaUtilDate')
                disable('JdkObsolete')
            }
        }
    }
}

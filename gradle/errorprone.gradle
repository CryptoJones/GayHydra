/* ###
 * ErrorProne static analysis.
 *
 * Addresses Rec 26 of the 2026-05-21 audit. See
 * docs/testing/ERRORPRONE.md for the full plan.
 *
 * Wires ErrorProne via the net.ltgt.errorprone Gradle plugin.
 * ErrorProne is a javac plugin: zero runtime cost, catches a known
 * set of mistakes at compile time. The intent for this rec is
 * *signal-only* — every check is at WARNING, not ERROR — until the
 * existing backlog is fixed (see ratchet in ERRORPRONE.md).
 *
 * Apply this from the root build.gradle:
 *   apply from: 'gradle/errorprone.gradle'
 *
 * The plugins {} block lives in the root build.gradle. This file just
 * applies the plugin to every java-library subproject and configures
 * it. We use raw -Xep:Name:SEVERITY javac args throughout rather than
 * the typed CheckSeverity enum because this script is parsed without
 * the plugin's classpath available (an `apply from:` constraint), so
 * `import net.ltgt.gradle.errorprone.CheckSeverity` fails to resolve.
 */

subprojects {
    plugins.withId('java-library') {
        apply plugin: 'net.ltgt.errorprone'

        // Gradle 8.5 registers the `errorprone` configuration eagerly
        // during the apply-plugin step, but the registration appears
        // to complete AFTER this block's synchronous body runs — so
        // a direct `dependencies { errorprone ... }` here used to NPE
        // with "configuration 'errorprone' not found". Gradle 9.5+
        // moved the registration earlier and masked the bug. Defer
        // via `pluginManager.withPlugin` so the dependency-add runs
        // after the plugin is fully applied on both Gradle versions.
        pluginManager.withPlugin('net.ltgt.errorprone') {
            dependencies {
                errorprone 'com.google.errorprone:error_prone_core:2.27.0'
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.errorprone {
                // Stage 1: signal-only. No checks at ERROR.
                allErrorsAsWarnings = true

                // High-EV checks at WARNING, expressed as raw javac args
                // so we don't need to import CheckSeverity in this script.
                errorproneArgs.addAll([
                    '-Xep:ImmutableEnumChecker:WARN',
                    '-Xep:MissingOverride:WARN',
                    '-Xep:MutableConstantField:WARN',
                    '-Xep:MutableMethodReturnType:WARN',
                    '-Xep:CollectionToArraySafeParameter:WARN',
                    '-Xep:DefaultCharset:WARN',
                    '-Xep:EqualsHashCode:WARN',
                    '-Xep:EqualsIncompatibleType:WARN',
                    '-Xep:StringSplitter:WARN',
                    // Rec 26 Stage 2 (Sprint 8): flip these from OFF
                    // to WARN. allErrorsAsWarnings=true above keeps
                    // them non-blocking; this just surfaces the
                    // existing backlog in the build log so we can
                    // measure the per-subproject count before
                    // pre-cleaning ≥50-warning subprojects toward
                    // Stage 3 (`ERROR` promotion).
                    '-Xep:JavaUtilDate:WARN',
                    '-Xep:JdkObsolete:WARN',
                ])
            }
        }
    }
}

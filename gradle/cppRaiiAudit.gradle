task cppRaiiAudit {
    description = 'Verify protected decompiler C++ files contain no raw `new` allocations.'
    group = 'verification'

    doLast {
        List<String> violations = []
        List<String> missing = []
        PROTECTED_FILES.each { rel, excludeRanges ->
            File f = new File(rootDir, rel)
            if (!f.exists()) {
                missing.add(rel)
                return
            }
            int lineNum = 0
            f.eachLine('UTF-8') { String line ->
                lineNum++
                // Skip pure-comment lines — both `//` line-comments
                // and `*` continuation lines inside `/* ... */` blocks.
                // Same simple filter as objectInputStreamAudit; string-
                // literal false positives can be fixed by the author.
                String trimmed = line.trim()
                if (trimmed.startsWith('//') || trimmed.startsWith('*')) {
                    return
                }
                // Per-file line-range exclusions for grandfathered
                // sites (e.g. bison `%union` semantic actions).
                boolean excluded = false
                for (range in excludeRanges) {
                    if (lineNum >= range[0] && lineNum <= range[1]) {
                        excluded = true
                        break
                    }
                }
                if (excluded) {
                    return
                }
                // Strip trailing `//` line-comments before applying
                // the regex. Catches false positives like
                //   CPUI_NEW = 69,   ///< Allocate a new object (new)
                // where the leading-`//`-startswith filter doesn't
                // help because the `//` is not at the start of the
                // trimmed line. `//` inside string literals would be
                // wrongly truncated, but the truncation only causes
                // false *negatives* if `new T(` appears inside the
                // string — string-literal `new` matches were already
                // documented as author-fixable false positives.
                int commentIdx = line.indexOf('//')
                String codeOnly = (commentIdx >= 0) ? line.substring(0, commentIdx) : line
                def m = RAW_NEW_PATTERN.matcher(codeOnly)
                if (m.find()) {
                    violations.add("${rel}:${lineNum} raw `new` allocation " +
                        "(use std::make_unique<T> or std::make_shared<T>)")
                }
            }
        }

        if (!missing.isEmpty()) {
            logger.warn 'cppRaiiAudit: protected files missing from tree (audit list out of date):'
            missing.each { logger.warn "  ${it}" }
        }
        if (!violations.isEmpty()) {
            logger.error '== C++ RAII audit failures =='
            violations.each { logger.error "  ${it}" }
            throw new GradleException(
                "${violations.size()} raw `new` allocation(s) in RAII-protected files. " +
                "See docs/decompiler/RAII_MIGRATION.md (Rec 31 #31-2) — protected files " +
                "must construct heap-owned objects via std::make_unique / std::make_shared.")
        }
        logger.lifecycle "cppRaiiAudit: ${PROTECTED_FILES.size()} protected file(s) clean."
    }
}

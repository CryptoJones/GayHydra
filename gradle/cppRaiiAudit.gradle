// match keeps the rule independent of the repo's root layout.
//
// Sprint 6 #31-2 starts with the address / space / rangeutil triangle
// that the audit named as foundation files; subsequent stages extend
// the set. Exclusions exist for bison-generated semantic actions whose
// raw-pointer ownership is mediated by the parser's `%union` + the
// `%destructor { delete $$; }` directive — those are the parser's
// value-stack contract, not user-level raw ownership, and they're
// pinned until Stage 2C Option A (variant-API rewrite) lands. See

/* ###
 * Software Bill of Materials (SBOM) generation for the GayHydra release.
 *
 * Addresses Rec 21 of the 2026-05-21 audit. See
 * docs/release/SBOM.md for the user-facing doc.
 *
 * Sprint 8 re-implementation: bumped cyclonedx-gradle-plugin from
 * 1.10.0 → 3.2.4. The 1.10.0 version introduced a strict PURL-
 * construction path that NPE'd on Ghidra's flat-dir dependencies
 * (`:AXMLPrinter2:` and similar — JARs declared via `flatDir`
 * repository with no Maven coordinates). Issue #500 in the plugin
 * repo, fixed by PR #532 (merged 2024-11-22), shipped in v2.0.0.
 * Plugin's current release is 3.2.4 (April 2026) — the rewrite
 * uses `Configuration.getIncoming()` + lenient artifactView which
 * gracefully handles deps without resolvable POMs.
 *
 * 3.x DSL changes from 1.x:
 * - `outputFormat = 'all'` → use `jsonOutput` + `xmlOutput` Property<RegularFile>.
 * - `includeConfigs` / `skipConfigs` / `skipProjects` moved to the
 *   `cyclonedxDirectBom` (per-project) task; the aggregate
 *   `cyclonedxBom` walks every config by default.
 * - `destination = file(...)` → `jsonOutput.set(...)` / `xmlOutput.set(...)`.
 *
 * Plugin declared in the root build.gradle's plugins {} block.
 * This file just configures the task + sanity-gate.
 */

cyclonedxBom {
    schemaVersion = '1.6'        // Latest CycloneDX spec as of plugin 3.2.4.
    projectType = 'application'

    // Both formats — downstream tools differ on JSON vs XML preference.
    jsonOutput = layout.buildDirectory.file('reports/sbom/bom.json')
    xmlOutput  = layout.buildDirectory.file('reports/sbom/bom.xml')

    includeBomSerialNumber = true
    includeBuildSystem = true
    includeLicenseText = false   // Keep the SBOM small; licenses are linked, not embedded.
}

// Hook the SBOM into the distribution flow. The release task
// (buildGhidra) depends on cyclonedxBom so the SBOM exists before
// the zip is assembled. cyclonedxBom in turn must produce a
// non-trivial SBOM (sanity gate).
afterEvaluate {
    tasks.matching { it.name == 'buildGhidra' }.configureEach {
        dependsOn 'cyclonedxBom'
    }
    tasks.matching { it.name == 'cyclonedxBom' }.configureEach {
        finalizedBy 'sbomSanityCheck'
    }
}

// Rec 21 sanity gate: a successful cyclonedxBom run must produce an
// SBOM with at least MIN_COMPONENTS components. A 0-or-handful-of-
// components SBOM means the configuration silently fell apart
// (typical cause: a renamed configuration in a future Gradle bump).
// Fail the build loudly rather than ship an empty SBOM.
final int MIN_COMPONENTS = 10
task sbomSanityCheck {
    description = 'Assert the CycloneDX SBOM at build/reports/sbom/bom.json has at least MIN_COMPONENTS entries.'
    group = 'verification'

    doLast {
        File bomJson = file("${buildDir}/reports/sbom/bom.json")
        if (!bomJson.exists()) {
            throw new GradleException(
                "Rec 21 SBOM sanity: expected SBOM at ${bomJson} but file is missing.")
        }
        def parsed = new groovy.json.JsonSlurper().parse(bomJson)
        def components = parsed.components ?: []
        int n = components.size()
        if (n < MIN_COMPONENTS) {
            throw new GradleException(
                "Rec 21 SBOM sanity: SBOM has ${n} components, expected >= ${MIN_COMPONENTS}. " +
                "Probable cause: a renamed/missing dependency configuration. " +
                "See docs/release/SBOM.md.")
        }
        logger.lifecycle "sbomSanityCheck: SBOM has ${n} components (threshold ${MIN_COMPONENTS})."
    }
}

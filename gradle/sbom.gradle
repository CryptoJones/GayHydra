/* ###
 * Software Bill of Materials (SBOM) generation for the GayHydra release.
 *
 * Addresses Rec 21 of the 2026-05-21 audit. See
 * docs/release/SBOM.md for the user-facing doc.
 *
 * Sprint 8 re-implementation: bumped cyclonedx-gradle-plugin from
 * 1.10.0 → 3.2.4. The 1.10.0 version introduced a strict PURL-
 * construction path that NPE'd on Ghidra's flat-dir dependencies
 * (`:AXMLPrinter2:` and similar — JARs declared via `flatDir`
 * repository with no Maven coordinates). Issue #500 in the plugin
 * repo, fixed by PR #532 (merged 2024-11-22), shipped in v2.0.0.
 * Plugin's current release is 3.2.4 (April 2026) — the rewrite
 * uses `Configuration.getIncoming()` + lenient artifactView which
 * gracefully handles deps without resolvable POMs.
 *
 * 3.x DSL changes from 1.x:
 * - `outputFormat = 'all'` → use `jsonOutput` + `xmlOutput` Property<RegularFile>.
 * - `includeConfigs` / `skipConfigs` / `skipProjects` moved to the
 *   `cyclonedxDirectBom` (per-project) task; the aggregate
 *   `cyclonedxBom` walks every config by default.
 * - `destination = file(...)` → `jsonOutput.set(...)` / `xmlOutput.set(...)`.
 * - `schemaVersion` is now an `org.cyclonedx.Version` enum (was String);
 *   valid values VERSION_10..VERSION_16.
 *
 * Three problems we ran into loading the `org.cyclonedx.Version` enum
 * for `schemaVersion = Version.VERSION_16`:
 *
 * 1. `import org.cyclonedx.Version` at script-top fails at compile time
 *    with "unable to resolve class" — the cyclonedx-core-java JAR isn't
 *    on the apply-from script's compile classpath.
 *
 * 2. Inline `org.cyclonedx.Version.VERSION_16` inside the
 *    `cyclonedxBom { ... }` closure fails with "Could not get unknown
 *    property 'org'" — Groovy resolves bare identifiers against the
 *    task delegate first.
 *
 * 3. `Class.forName('org.cyclonedx.Version')` at script-top fails with
 *    ClassNotFoundException — the apply-from script's classloader
 *    doesn't include the plugin's transitive deps. Gradle isolates
 *    each plugin's classpath in a child loader.
 *
 * Walk through the plugin instance's classloader to find Version. That
 * classloader is the one with cyclonedx-core-java loaded.
 *
 * Note on the `hasPlugin` guard: the gradle/actions/dependency-submission
 * action runs Gradle in a stripped-down mode that doesn't apply the
 * `org.cyclonedx.bom` plugin. Skip the cyclonedxBom + sbomSanityCheck
 * wiring entirely when the plugin isn't present; the dep-submission
 * action only needs the dependency graph, not the SBOM task.
 *
 * Plugin declared in the root build.gradle's plugins {} block.
 * This file just configures the task + sanity-gate.
 */

if (plugins.hasPlugin('org.cyclonedx.bom')) {
    // Look up both enum values via the plugin's classloader. Both
    // schemaVersion (org.cyclonedx.Version) and projectType
    // (org.cyclonedx.model.Component$Type) became enums in plugin 3.x.
    def cdxClassLoader = plugins.getPlugin('org.cyclonedx.bom').class.classLoader
    def cdxVersionEnum = cdxClassLoader.loadClass('org.cyclonedx.Version').enumConstants
            .find { it.name() == 'VERSION_16' }
    def cdxProjectTypeApp = cdxClassLoader.loadClass('org.cyclonedx.model.Component$Type').enumConstants
            .find { it.name() == 'APPLICATION' }

    cyclonedxBom {
        schemaVersion = cdxVersionEnum       // CycloneDX 1.6 (latest as of plugin 3.2.4).
        projectType = cdxProjectTypeApp      // Application (root project type for the SBOM metadata).

        // Both formats — downstream tools differ on JSON vs XML preference.
        jsonOutput = layout.buildDirectory.file('reports/sbom/bom.json')
        xmlOutput  = layout.buildDirectory.file('reports/sbom/bom.xml')

        includeBomSerialNumber = true
        includeBuildSystem = true
        includeLicenseText = false   // Keep the SBOM small; licenses are linked, not embedded.
    }

    // Hook the SBOM into the distribution flow. The release task
    // (buildGhidra) depends on cyclonedxBom so the SBOM exists before
    // the zip is assembled. cyclonedxBom in turn must produce a
    // non-trivial SBOM (sanity gate).
    afterEvaluate {
        tasks.matching { it.name == 'buildGhidra' }.configureEach {
            dependsOn 'cyclonedxBom'
        }
        tasks.matching { it.name == 'cyclonedxBom' }.configureEach {
            finalizedBy 'sbomSanityCheck'
        }
    }

    // Plugin 3.x auto-registers a per-subproject `cyclonedxDirectBom`
    // task on every project that applies `java-library`. Each
    // per-project task writes its SBOM into the subproject's
    // `build/reports/sbom/` directory — which Gradle 8.5+ then flags
    // as an undeclared input to `:assembleDistribution`, breaking the
    // build with "Task ':assembleDistribution' uses this output of
    // task ':decompile:cyclonedxDirectBom' without declaring an
    // explicit or implicit dependency."
    //
    // We don't want or use the per-subproject SBOMs — the aggregate
    // `cyclonedxBom` at the root produces a single SBOM with all
    // resolved deps, which is what release.yml extracts and signs.
    // Disable the per-subproject tasks so they don't write into the
    // tree-walked dist directories at all.
    subprojects {
        tasks.matching { it.name == 'cyclonedxDirectBom' }.configureEach {
            enabled = false
        }
    }
}

// Rec 21 sanity gate: a successful cyclonedxBom run must produce an
// SBOM with at least MIN_COMPONENTS components. A 0-or-handful-of-
// components SBOM means the configuration silently fell apart
// (typical cause: a renamed configuration in a future Gradle bump).
// Fail the build loudly rather than ship an empty SBOM.
final int MIN_COMPONENTS = 10
task sbomSanityCheck {
    description = 'Assert the CycloneDX SBOM at build/reports/sbom/bom.json has at least MIN_COMPONENTS entries.'
    group = 'verification'

    doLast {
        File bomJson = file("${buildDir}/reports/sbom/bom.json")
        if (!bomJson.exists()) {
            throw new GradleException(
                "Rec 21 SBOM sanity: expected SBOM at ${bomJson} but file is missing.")
        }
        def parsed = new groovy.json.JsonSlurper().parse(bomJson)
        def components = parsed.components ?: []
        int n = components.size()
        if (n < MIN_COMPONENTS) {
            throw new GradleException(
                "Rec 21 SBOM sanity: SBOM has ${n} components, expected >= ${MIN_COMPONENTS}. " +
                "Probable cause: a renamed/missing dependency configuration. " +
                "See docs/release/SBOM.md.")
        }
        logger.lifecycle "sbomSanityCheck: SBOM has ${n} components (threshold ${MIN_COMPONENTS})."
    }
}

/* ###
 * Software Bill of Materials (SBOM) generation for the Ghidra release.
 *
 * Addresses Rec 21 of the 2026-05-21 audit. See
 * docs/release/SBOM.md for the user-facing doc.
 *
 * Wires the CycloneDX Gradle plugin (org.cyclonedx.bom) into the
 * root build. The default output is build/reports/bom.json and
 * build/reports/bom.xml; the distribution task collects both into
 * the release zip under `support/sbom/`.
 *
 * Apply this from the root build.gradle:
 *   apply from: 'gradle/sbom.gradle'
 */

plugins {
    id 'org.cyclonedx.bom' version '1.10.0'
}

cyclonedxBom {
    // Schema version of the produced SBOM. 1.5 is the current spec.
    schemaVersion = '1.5'
    // Project type per CycloneDX taxonomy.
    projectType = 'application'
    // Emit both JSON and XML; some downstream tools prefer one.
    outputFormat = 'all'
    // SBOM files end up here; the distribution task copies them.
    destination = file("${buildDir}/reports/sbom")
    // Include all configurations by default. The root project + every
    // subproject's runtimeClasspath is what enterprise consumers want
    // to see — the things that actually ship.
    includeConfigs = ['runtimeClasspath']
    skipConfigs = ['providedRuntime']
    // Don't fail the build if a single subproject has no deps — Ghidra
    // has many module subprojects that are themselves dependencies of
    // others; the aggregate root SBOM is what matters.
    skipProjects = []
}

// Hook the SBOM into the distribution flow. The release task
// (buildGhidra) depends on cyclonedxBom so the SBOM exists before
// the zip is assembled. cyclonedxBom in turn must produce a
// non-trivial SBOM (sanity gate).
afterEvaluate {
    tasks.matching { it.name == 'buildGhidra' }.configureEach {
        dependsOn 'cyclonedxBom'
    }
    tasks.matching { it.name == 'cyclonedxBom' }.configureEach {
        finalizedBy 'sbomSanityCheck'
    }
}

// Rec 21 sanity gate: a successful cyclonedxBom run must produce an
// SBOM with at least MIN_COMPONENTS components. A 0-or-handful-of-
// components SBOM means the configuration silently fell apart
// (typical cause: a renamed configuration in a future Gradle bump).
// Fail the build loudly rather than ship an empty SBOM.
final int MIN_COMPONENTS = 10
task sbomSanityCheck {
    description = 'Assert the CycloneDX SBOM at build/reports/sbom/bom.json has at least MIN_COMPONENTS entries.'
    group = 'verification'

    doLast {
        File bomJson = file("${buildDir}/reports/sbom/bom.json")
        if (!bomJson.exists()) {
            throw new GradleException(
                "Rec 21 SBOM sanity: expected SBOM at ${bomJson} but file is missing.")
        }
        def parsed = new groovy.json.JsonSlurper().parse(bomJson)
        def components = parsed.components ?: []
        int n = components.size()
        if (n < MIN_COMPONENTS) {
            throw new GradleException(
                "Rec 21 SBOM sanity: SBOM has ${n} components, expected >= ${MIN_COMPONENTS}. " +
                "Probable cause: a renamed/missing dependency configuration. " +
                "See docs/release/SBOM.md.")
        }
        logger.lifecycle "sbomSanityCheck: SBOM has ${n} components (threshold ${MIN_COMPONENTS})."
    }
}

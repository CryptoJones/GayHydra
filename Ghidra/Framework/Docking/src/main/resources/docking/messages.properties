# docking.messages — Docking framework UI strings.
# Populated in the localization PoC sweep (PR 2). PR 1 ships the file
# empty so the bundle is registered on the classpath and Messages.tr()
# under the "docking.*" prefix resolves rather than throwing.
#
# Keys: docking.<scope>.<element>[.<role>]
#   scope: class-purpose bucket (action, dialog, menu, finddialog, ...)
#   element: button|label|tooltip|title|body|menu
#   role: optional disambiguator (label vs tooltip on the same button)
#
# Translations land as docking/messages_<locale>.properties (managed
# by Crowdin in PR 3).

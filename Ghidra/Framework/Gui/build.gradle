import org.gradle.plugins.ide.eclipse.model.Container;

apply from: "$rootProject.projectDir/gradle/distributableGhidraModule.gradle"
apply from: "$rootProject.projectDir/gradle/javaProject.gradle"
apply from: "$rootProject.projectDir/gradle/jacocoProject.gradle"
apply from: "$rootProject.projectDir/gradle/javaTestProject.gradle"
apply from: "$rootProject.projectDir/gradle/javadoc.gradle"
apply plugin: 'eclipse'

eclipse.project.name = 'Framework Gui'

dependencies {
	api project(':Generic')
	api 'com.formdev:flatlaf:3.5.4'
	
	compileOnly "junit:junit:4.13.2"
	
	testImplementation project(path: ':Generic', configuration: 'testArtifacts')
}

ext.addExports([
	'java.desktop/sun.awt=ALL-UNNAMED'
])

// l10n PoC: generate the en-XA pseudo-locale bundle for the core
// messages bundle. Modules with their own messages.properties wire an
// analogous task using PseudoLocaleGenerator.generate(...). The pseudo
// bundle is committed alongside the source bundle for PR 2 visual QA;
// PR 4 may move it to a build-only artifact so it doesn't ship in
// release jars.
tasks.register('generatePseudoLocale', JavaExec) {
	group = 'i18n'
	description = 'Regenerate core/messages_en_XA.properties from the source bundle.'
	dependsOn 'classes'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'generic.i18n.PseudoLocaleGenerator'
	args = [
		file('src/main/resources/core/messages.properties').absolutePath,
		file('src/main/resources/core/messages_en_XA.properties').absolutePath
	]
}


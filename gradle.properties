# Increase maximum Gradle heap size (default is 1G)
# And fix build in locales with non-default capitalizations (e.g. tr_TR)
org.gradle.jvmargs=-Xmx2G -Duser.language=en -Duser.country=US

# Preserve file system permissions in archives (Gradle 9 uses fixed permissions by default)
org.gradle.archives.use-file-system-permissions=true

# Set Ghidra protobuf version
ghidra.protobuf.java.version=4.31.0

# Reuse task outputs across builds and CI jobs. The CI `unit_tests` job
# (needs: build) runs on a fresh runner and re-compiles everything the
# `build` job already produced; with the build cache persisted via
# gradle/actions/setup-gradle, those tasks become cache hits instead of
# full recompiles. Build-cache misses are non-fatal (a non-cacheable
# task simply runs normally), so this is safe to enable globally.
org.gradle.caching=true

# Parallel project execution. CI already passes this on the command line
# (`gradle ... --parallel`); making it the default keeps local builds
# consistent with CI. NOTE: org.gradle.configuration-cache is deliberately
# NOT enabled — Ghidra's build scripts reference Gradle script objects
# from Groovy closures, which the configuration cache rejects.
org.gradle.parallel=true
